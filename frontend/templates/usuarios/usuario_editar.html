{% extends "base.html" %}

{% block title %}Editar usuario | Kane{% endblock %}

{% block content %}
    <h1>Editar usuario</h1>
    <p><a href="{{ url_for('users') }}">Volver a gestión de usuarios</a></p>

    <section class="card">
        <form method="post" action="{{ url_for('edit_user', user_id=usuario.id_usuario) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-grid">
                <div>
                    <label for="nombre_usuario">Nombre *</label>
                    <input id="nombre_usuario" name="nombre_usuario" maxlength="50"
                           value="{{ usuario.nombre_usuario }}" required>
                </div>
                <div>
                    <label for="email">Correo *</label>
                    <input id="email" name="email" type="email" maxlength="100"
                           value="{{ usuario.email }}" required>
                </div>
                <div>
                    <label for="contrasena">Nueva contraseña</label>
                    <input id="contrasena" name="contrasena" type="password" minlength="8"
                           autocomplete="new-password"
                           aria-describedby="ayuda-contrasena">
                    <small id="ayuda-contrasena">Déjala vacía para conservar la contraseña actual.</small>
                </div>
                <div>
                    <label for="rol">Rol *</label>
                    <select id="rol" name="rol" required>
                        <option value="vendedor" {% if usuario.rol == "vendedor" %}selected{% endif %}>
                            Vendedor
                        </option>
                        <option value="administrador"
                                {% if usuario.rol == "administrador" %}selected{% endif %}>
                            Administrador
                        </option>
                    </select>
                </div>
                <div>
                    <label for="estado">Estado *</label>
                    <select id="estado" name="estado" required>
                        <option value="activo" {% if usuario.estado == "activo" %}selected{% endif %}>
                            Activo
                        </option>
                        <option value="inactivo"
                                {% if usuario.estado == "inactivo" %}selected{% endif %}>
                            Inactivo
                        </option>
                    </select>
                </div>
            </div>
            <p><button type="submit">Guardar cambios</button></p>
        </form>
    </section>
{% endblock %}
